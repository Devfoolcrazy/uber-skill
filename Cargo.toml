[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/cli",
    "apps/desktop/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
uber-skill-core = { path = "crates/core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "2"
walkdir = "2"
sha2 = "0.10"
hex = "0.4"
similar = { version = "2", features = ["inline"] }
directories = "6"
chrono = { version = "0.4", features = ["serde"] }
regex = "1"
clap = { version = "4", features = ["derive", "env"] }
anyhow = "1"
tempfile = "3"

# Tauri release profile (see https://tauri.app/concept/size/)
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
